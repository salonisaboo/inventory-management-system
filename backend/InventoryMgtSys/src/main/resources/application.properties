spring.application.name=InventoryMgtSys

# Server Port
server.port=${SERVER_PORT:8084}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/inventory
spring.datasource.username=root
spring.datasource.password=*********
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

secreteJwtString=${JWT_SECRET:yourSuperSecretKeyThatIsAtLeast32CharactersLong!}
app.product.images-dir=${PRODUCT_IMAGES_DIR:../../frontend/public/products}
app.product.public-path=${PRODUCT_PUBLIC_PATH:products}

